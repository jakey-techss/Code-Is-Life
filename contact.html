<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="icon" type="image/x-icon" href="assets/e-removebg-preview.png">
    <title>Code Is Life | Contact Me</title>
</head>

<body>
    <nav>
        <h2>Code Is Life</h2>
        <div id="links">
            <a href="index.html">
                <p>Home</p>
            </a>
            <a href="about.html">
                <p>About me</p>
            </a>
            <a href="projects.html">
                <p>Projects</p>
            </a>
            <a href="contact.html">
                <p>Contact me</p>
            </a>
        </div>
        <span class="material-icons" id="menu">menu</span>
    </nav>

    <section id="contact2">
        <h4>Contact Me</h4>
        <form>
            <div id="contact-form">
                <div class="name-container">
                    <div class="form-group">
                        <label for="first-name">First Name:</label>
                        <input type="text" id="first-name" name="first-name" placeholder="e.g. John" required>
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last Name:</label>
                        <input type="text" id="last-name" name="last-name" placeholder="e.g. Doe" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="e.g. john.doe@example.com" required>
                </div>
                <div class="form-group">
                    <label for="reason">Reason:</label>
                    <select id="reason" name="reason" required>
                        <option value="general">General Inquiry</option>
                        <option value="project">Project Collaboration</option>
                        <option value="recommendation">Recommendation</option>
                        <option value="feedback">Feedback</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" placeholder="Enter your message" required></textarea>
                </div>
            </div>
            <button id="submit">Submit</button>
        </form>
    </section>

    <footer>
        <div id="footer-container">
            <div class="footer-section">
                <p>@Copyright 2025 Code Is Life</p>
            </div>
        </div>
    </footer>
    <script src="home.js"></script>
</body>

</html>
